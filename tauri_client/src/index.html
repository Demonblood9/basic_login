<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure License Client</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Animated background -->
        <div class="bg-gradient"></div>
        <div class="bg-gradient-2"></div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L3 7V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9 12L11 14L15 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 class="app-title">Secure License</h1>
                <p class="app-subtitle">Authentication System</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="licenseKey">License Key</label>
                    <input
                        type="text"
                        id="licenseKey"
                        placeholder="Enter your license key"
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Remember my key</span>
                    </label>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="btn-text">Authenticate</span>
                    <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <button type="button" class="btn-secondary" id="clearBtn">
                    Clear
                </button>
            </form>

            <!-- Status Display -->
            <div id="statusDisplay" class="status-display hidden">
                <div class="status-icon" id="statusIcon"></div>
                <div class="status-content">
                    <div class="status-title" id="statusTitle"></div>
                    <div class="status-message" id="statusMessage"></div>
                </div>
            </div>

            <!-- Success Display -->
            <div id="successDisplay" class="success-display hidden">
                <div class="success-header">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="#10b981" stroke-width="2"/>
                        <path d="M8 12L11 15L16 9" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <h3>Authentication Successful</h3>
                </div>
                <div class="success-details" id="successDetails"></div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p>Authenticating...</p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
